name: CodeGuard AI Continuous Integration (CI)

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: 1. Backend Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/code-intelligence/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/code-intelligence" -e "./apps/api[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check apps/api packages/code-intelligence scripts

  backend-test-and-migrations:
    name: 2. Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeguard_ci
          POSTGRES_PASSWORD: codeguard_ci_secret
          POSTGRES_DB: codeguard_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeguard_ci -d codeguard_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/code-intelligence/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/code-intelligence" -e "./apps/api[dev]"

      - name: Validate Database Migrations (Alembic)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://codeguard_ci:codeguard_ci_secret@localhost:5432/codeguard_ci_test
        run: |
          alembic upgrade head
          alembic current

      - name: Run Backend Pytest Suite
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://codeguard_ci:codeguard_ci_secret@localhost:5432/codeguard_ci_test
          REDIS_URL: redis://localhost:6379/0
          GITHUB_WEBHOOK_SECRET: ci-test-webhook-secret-at-least-16-chars
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          DEV_AUTH_BYPASS: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"
          LLM_PROVIDER: mock
        run: |
          pytest apps/api/tests -v --durations=10

  frontend-check:
    name: 3. Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies from lockfile
        working-directory: apps/web
        run: npm ci

      - name: Run Frontend Typecheck (TypeScript)
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Dashboard
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  container-build-and-security:
    name: 4. Container Build & Image Validation
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test-and-migrations, frontend-check]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API & Worker Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          load: true
          tags: codeguard-api:${{ github.sha }}

      - name: Build Web Dashboard Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          load: true
          tags: codeguard-web:${{ github.sha }}

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: codeguard-api:${{ github.sha }}
          format: "table"
          severity: "CRITICAL"
          exit-code: "0"
