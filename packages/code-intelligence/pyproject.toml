[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-code-intelligence"
version = "0.1.0"
description = "CodeGuard - Code Intelligence Engine (Tree-sitter AST, Symbol Graph, Context Ranking)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "unidiff>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["code_intelligence*"]
